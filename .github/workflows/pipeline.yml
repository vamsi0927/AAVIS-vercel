name: AAVIS E2E CI/CD & Security Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Stage 1: Security Audit
  security-review:
    name: Security Review & SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Semgrep SAST Audit
        run: npx semgrep --config=auto src/ || true

      - name: Run Trivy Security Scan
        run: |
          npx trivy fs . --severity HIGH,CRITICAL || true

      - name: Run Gitleaks Secrets Audit
        run: |
          npx gitleaks detect --verbose || true

  # Stage 2: Web App Deployment
  deploy-gh-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Clean Cache & Deploy Web Build
        run: |
          npx gh-pages-clean
          # Build without Gemini API key, then deploy
          export VITE_GEMINI_API_KEY=""
          npm run deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stage 3: Selenium E2E Web Tests
  selenium-e2e-tests:
    name: Selenium E2E Web Tests
    needs: deploy-gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Headless Selenium Login Test
        run: npm run login
        env:
          BASE_URL: https://vamsi0927.github.io/AAVIS-vercel

  # Stage 4: Appium Android E2E Tests
  appium-tests:
    name: Appium Android E2E Tests
    needs: selenium-e2e-tests
    runs-on: macos-13
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Start Appium Server
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium --log ./automation/logs/appium.log &

      - name: Build Android App (Assemble Debug APK)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Run Appium Test Suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu off -no-audio -no-boot-anim -camera-back none
          disable-spellchecker: true
          script: |
            adb wait-for-device
            adb shell input keyevent 82
            node automation/runners/run-local.cjs

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-execution-reports
          path: |
            automation/reports/excel/
            automation/reports/html/
            automation/reports/logs/
            automation/reports/screenshots/
          retention-days: 14

  # Stage 5: Load & Performance Testing
  load-testing:
    name: API Load Testing
    needs: appium-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run API Endpoint Load Test
        run: npm run load-test
