name: AAVIS E2E CI/CD & Security Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Stage 1: Build & Lint
  build-and-lint:
    name: Build + Static Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint || echo "Lint warnings allowed for now"

      - name: Build Web Application
        run: npm run build
        env:
          VITE_SUPABASE_URL: "https://lfhnlsniuubcvjpjwldj.supabase.co"
          VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmaG5sc25pdXViY3ZqcGp3bGRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODY1NTAsImV4cCI6MjA5NDE2MjU1MH0.yhY_JtKYOikbja4PNIXcq52iWANqYfvzOQF4gNMcuyM"

  # Stage 2: Security Audit
  security-review:
    name: Security Review & SAST
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Security Tests (Sast, Dependency, Headers, Auth Boundaries)
        run: |
          mkdir -p reports/security
          node security-tests.cjs || echo "Security test issues detected"
        env:
          PORT: 3001

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/security/
          retention-days: 14

  # Stage 3: Deploy to GitHub Pages (Preview/Staging Env)
  deploy-gh-pages:
    name: Deploy Test Environment
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build
        env:
          VITE_SUPABASE_URL: "https://lfhnlsniuubcvjpjwldj.supabase.co"
          VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmaG5sc25pdXViY3ZqcGp3bGRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODY1NTAsImV4cCI6MjA5NDE2MjU1MH0.yhY_JtKYOikbja4PNIXcq52iWANqYfvzOQF4gNMcuyM"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

  # Stage 4: API Functional Testing (Separate from Load)
  api-functional-testing:
    name: API Functional Testing
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Functional API Tests
        run: node api-functional-tests.cjs

      - name: Upload API Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-reports
          path: Test Results/API/
          retention-days: 14

  # Stage 5: Integration & Data Sync Testing
  integration-testing:
    name: Integration & Data Sync
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Integration Tests
        run: node integration-tests.cjs

  # Stage 6: Selenium E2E Web Tests
  selenium-e2e-tests:
    name: Selenium E2E Web Tests
    needs: deploy-gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Start Preview Server
        run: npx vite preview --port 4173 &

      - name: Run Full Selenium Test Suite
        run: npx mocha selenium/tests/*.test.js --timeout 60000 --reporter mochawesome --reporter-options reportDir=selenium/reports,overwrite=true
        env:
          BASE_URL: http://localhost:4173

      - name: Upload Selenium Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-reports
          path: selenium/reports/
          retention-days: 14

  # Stage 7: Appium Android E2E Tests
  appium-tests:
    name: Appium Android E2E Tests
    needs: build-and-lint
    runs-on: macos-13
    continue-on-error: true # Do not block downstream API/Load/Summary runs on emulator failures
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Appium Mock Runner
        run: node automation/runners/run-local.cjs

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-execution-reports
          path: |
            automation/reports/
          retention-days: 14

  # Stage 8: Load & Performance Testing
  load-testing:
    name: API Load Testing
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run API Endpoint Load Test
        run: npm run load-test

  # Stage 9: Final QA Summary aggregation
  final-qa-summary:
    name: Final QA Summary
    needs: [build-and-lint, security-review, api-functional-testing, integration-testing, selenium-e2e-tests, appium-tests, load-testing]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Aggregate & Report Results
        run: |
          echo "### AAVIS Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Outcome |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Lint | ${{ needs.build-and-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Audit | ${{ needs.security-review.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API Functional Tests | ${{ needs.api-functional-testing.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-testing.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Selenium Web E2E | ${{ needs.selenium-e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Appium Android E2E | ${{ needs.appium-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API Load Testing | ${{ needs.load-testing.result }} |" >> $GITHUB_STEP_SUMMARY
          
          # Check for failures in core required pipelines
          if [ "${{ needs.build-and-lint.result }}" = "failure" ] || \
             [ "${{ needs.security-review.result }}" = "failure" ] || \
             [ "${{ needs.api-functional-testing.result }}" = "failure" ] || \
             [ "${{ needs.integration-testing.result }}" = "failure" ] || \
             [ "${{ needs.selenium-e2e-tests.result }}" = "failure" ] || \
             [ "${{ needs.load-testing.result }}" = "failure" ]; then
            echo "❌ Core QA pipeline runs detected failures."
            exit 1
          fi
          echo "✅ All core QA pipelines passed."
