  auth-flows:
    name: "Module 1: Authentication & Register"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: "https://lfhnlsniuubcvjpjwldj.supabase.co"
          VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmaG5sc25pdXViY3ZqcGp3bGRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODY1NTAsImV4cCI6MjA5NDE2MjU1MH0.yhY_JtKYOikbja4PNIXcq52iWANqYfvzOQF4gNMcuyM"
      - run: |
          Xvfb :99 -screen 0 1280x900x24 &
          export DISPLAY=:99
          npx vite preview --port 4173 &
          sleep 3
          npx mocha selenium/tests/auth.test.js selenium/tests/forgot_password.test.js \
            --timeout 90000 --reporter mochawesome \
            --reporter-options reportDir=selenium/reports/auth,overwrite=true,reportFilename=auth-report
        env:
          BASE_URL: http://localhost:4173
          DISPLAY: ':99'
