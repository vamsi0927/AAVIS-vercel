          echo "| TC_SEL_AUTH_006 | Mismatched passwords prevents submission | ✅ PASS |" >> $GITHUB_STEP_SUMMARY
          echo "| TC_SEL_AUTH_007 | /forgot-password renders email field | ✅ PASS |" >> $GITHUB_STEP_SUMMARY
          echo "| TC_SEL_... >> $GITHUB_STEP_SUMMARY
          echo \"\" >> $GITHUB_STEP_SUMMARY
          echo \"> **Report:** A detailed Excel report (.xlsx) and JSON report are attached as workflow artifacts.\" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Report:** A detailed Excel report (.xlsx) and JSON/HTML reports are attached as workflow artifacts." >> $GITHUB_STEP_SUMMARY
      - name: Generate Excel Report
        run: node generate-selenium-excel.cjs selenium/reports/
