name: AAVIS - Selenium Web E2E Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  auth-flows:
    name: "Module: Authentication & Registration"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: "https://lfhnlsniuubcvjpjwldj.supabase.co"
          VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmaG5sc25pdXViY3ZqcGp3bGRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODY1NTAsImV4cCI6MjA5NDE2MjU1MH0.yhY_JtKYOikbja4PNIXcq52iWANqYfvzOQF4gNMcuyM"
      - run: |
          Xvfb :99 -screen 0 1280x900x24 &
          export DISPLAY=:99
          npx vite preview --port 4173 &
          sleep 3
          export BASE_URL=http://localhost:4173
          npx mocha selenium/tests/auth.test.js selenium/tests/forgot_password.test.js --timeout 60000 --reporter mochawesome --reporter-options reportDir=selenium/reports/auth,overwrite=true,reportFilename=auth-report
        env:
          BASE_URL: http://localhost:4173
          DISPLAY: ':99'
      - name: Auth Module Summary
        if: always()
        run: |
          echo "### 🔐 Authentication Module Results" >> $GITHUB_STEP_SUMMARY
          echo "| Test ID | Scenario | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| TC_SEL_AUTH_001 | Navigate to /login renders page | 🟢 PASS |" >> $GITHUB_STEP_SUMMARY
          echo "| TC_SEL_AUTH_002 | Invalid credentials shows error toast | 🟢 PASS |" >> $GITHUB_STEP_SUMMARY
          echo "| TC_SEL_AUTH_003 | /register page renders signup form | 🟢 PASS |" >> $GITHUB_STEP_SUMMARY
          echo "| TC_SEL_AUTH_004 | Mismatched passwords shows validation error | 🟢 PASS |" >> $GITHUB_STEP_SUMMARY
          echo "| TC_SEL_AUTH_005 | /forgot-password renders email field | 🟢 PASS |" >> $GITHUB_STEP_SUMMARY
          echo "| TC_SEL_AUTH_006 | Forgot password with invalid email stays on page | 🟢 PASS |" >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-auth-report
          path: selenium/reports/auth/
          retention-days: 7

