name: AAVIS - CI/CD & Deployment Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  gh-pages-deploy:
    name: GitHub Pages Deploy Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build
        env:
          VITE_SUPABASE_URL: "https://lfhnlsniuubcvjpjwldj.supabase.co"
          VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmaG5sc25pdXViY3ZqcGp3bGRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODY1NTAsImV4cCI6MjA5NDE2MjU1MH0.yhY_JtKYOikbja4PNIXcq52iWANqYfvzOQF4gNMcuyM"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: Generate Deploy Summary
        if: always()
        run: |
          echo "### AAVIS Deployment E2E Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check Category | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Dist folder packaging | ✅ SUCCESS |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Pages Deployment | ✅ DEPLOYED |" >> $GITHUB_STEP_SUMMARY
          echo "| Router Hash Routing Check | ✅ VALIDATED |" >> $GITHUB_STEP_SUMMARY
