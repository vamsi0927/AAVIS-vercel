name: Android Appium E2E Automation & CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # Run nightly at 2 AM UTC

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: macos-13 # macOS is required to support hardware acceleration for Android Emulator in VM
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android App (Assemble Debug APK)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Start Appium Server
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium --log ./automation/logs/appium.log &
        async: true

      - name: Verify Appium Health
        run: |
          sleep 10
          curl -s http://127.0.0.1:4723/wd/hub/status || curl -s http://127.0.0.1:4723/status || exit 1

      - name: Start Android Emulator and Execute Appium Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu off -no-audio -no-boot-anim -camera-back none
          disable-spellchecker: true
          script: |
            adb wait-for-device
            adb shell input keyevent 82
            node automation/runners/run-local.cjs

      - name: Publish Markdown Summary to Job Run
        if: always()
        run: |
          if [ -f ./automation/reports/summary/summary.md ]; then
            cat ./automation/reports/summary/summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "Summary report not found!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Appium-E2E-Execution-Reports
          path: |
            automation/reports/excel/
            automation/reports/html/
            automation/reports/json/
            automation/reports/summary/
            automation/screenshots/
            automation/logs/
          retention-days: 30

      - name: Deploy HTML Dashboard to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./automation/reports/html
          destination_dir: reports/latest

      - name: Archive Historical Reports to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./automation/reports/history
          destination_dir: reports/history
          keep_files: true
