name: AAVIS - Complete QA Summary

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compile-qa-summary:
    name: Compile Master Quality Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate QA Status Report
        run: node scripts/generate-test-database.cjs

      - name: Print Aggregated Dashboard
        run: |
          cat docs/QA_STATUS.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Master QA Workbook & Database
        uses: actions/upload-artifact@v4
        with:
          name: complete-qa-reports
          path: |
            Test Results/
            docs/QA_STATUS.md
          retention-days: 14
