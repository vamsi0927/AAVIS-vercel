name: AAVIS - Complete QA Summary

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions: write-all

jobs:
  setup-and-build:
    name: 🏗️ Setup & Code Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # We upload the dist folder so Selenium doesn't have to rebuild it
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/

  security-scan:
    name: 🔐 Security & Vulnerability Scan
    needs: setup-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: node scripts/run_vulnerability_tests.cjs || true
      - uses: actions/upload-artifact@v4
        with:
          name: security-results
          path: Test Results/Security/

  performance-load:
    name: ⚡ API Performance & Load Test
    needs: setup-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: node scripts/run_load_tests.cjs || true
      - uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: Test Results/Performance/

  web-e2e-selenium:
    name: 🌐 Web E2E (Selenium)
    needs: setup-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      
      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist/


      - name: Boot Frontend & Execute Real Web UI Tests
        env:
          BASE_URL: http://localhost:4173
        run: |
          npx vite preview --port 4173 &
          sleep 5
          mkdir -p selenium/reports/sync
          npx mocha selenium/tests/real_e2e_suite.test.js --reporter mochawesome --reporter-options reportDir=selenium/reports/sync,overwrite=true,reportFilename=mochawesome || true
      - uses: actions/upload-artifact@v4
        with:
          name: selenium-results
          path: selenium/reports/

  mobile-e2e-appium:
    name: 📱 Mobile E2E (Appium Android)
    needs: setup-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute WebdriverIO tests against Mock Appium
        run: |
          node scripts/mock_appium_server.cjs &
          sleep 3
          mkdir -p automation/reports/json
          npx wdio run wdio.conf.js || true
      - uses: actions/upload-artifact@v4
        with:
          name: appium-results
          path: automation/reports/

  aggregate-master-report:
    name: 🏆 Aggregate Master QA Report
    needs: [security-scan, performance-load, web-e2e-selenium, mobile-e2e-appium]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      # Download outputs from previous parallel jobs to aggregate them
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: Test Results/

      - name: Generate Master Summary Dashboard
        run: |
          # Move the artifacts out of "Test Results" root if they got dumped there to ensure generator scripts find them
          mkdir -p "Test Results/Security"
          mkdir -p "Test Results/Performance"
          mkdir -p "selenium/reports/sync"
          mkdir -p "automation/reports/json"
          mv "Test Results"/mochawesome.json "selenium/reports/sync/" 2>/dev/null || true
          mv "Test Results"/execution-results.json "automation/reports/json/" 2>/dev/null || true
          mv "Test Results"/*.json "Test Results/Security/" 2>/dev/null || true
          mv "Test Results/Security"/*load-test*.json "Test Results/Performance/" 2>/dev/null || true
          
          # Generate HTML reports
          node generate_html_reports.cjs || true
          
          # Commit the HTML reports so htmlpreview.github.io can access them
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add "Test Results/HTML/"
          git commit -m "chore: update QA HTML reports" || true
          git push || true
          
          node generate_github_summary.cjs || true
          node scripts/audit_and_rebuild_excel.cjs

      - name: Upload Final Excel Master Report
        uses: actions/upload-artifact@v4
        with:
          name: complete-qa-reports
          path: Test Results/
